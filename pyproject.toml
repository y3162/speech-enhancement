[tool.ruff]
target-version = "py310"
src = ["."]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "B", "ANN"]
ignore = ["E501", "ANN401", "N812", "N817", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src"]
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "basic"
